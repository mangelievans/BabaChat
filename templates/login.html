{% extends "base.html" %}
{% block title %}Log in · Mangeli Messenger{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="auth-side"><div class="big-symbol">✳</div><h2>Pick up where<br>you left off.</h2><p>Your conversations are waiting for you.</p></div>
  <form class="auth-card" method="post">
    <div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><p class="muted">Enter your account details below.</p>
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" placeholder="Your username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
    <button class="button primary full" type="submit">Log in <span>→</span></button>
    <p class="auth-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
